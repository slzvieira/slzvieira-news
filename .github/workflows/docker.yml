name: Build and publish Docker image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Determine image tag
        id: vars
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push image with Jib
        run: |
          ./mvnw -B clean package jib:build \
            -Djib.to.image="docker.io/${{ secrets.DOCKERHUB_USERNAME }}/slzvieira-news:${{ steps.vars.outputs.tag }}" \
            -Djib.to.auth.username="${{ secrets.DOCKERHUB_USERNAME }}" \
            -Djib.to.auth.password="${{ secrets.DOCKERHUB_TOKEN }}"
